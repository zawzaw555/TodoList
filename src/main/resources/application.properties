spring.application.name=todo
spring.datasource.url=jdbc:mysql://localhost:3306/todo_db?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQLでもschema.sqlを実行する
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# MyBatis設定
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.java.todo.models

logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.com.java.todo.repositories=DEBUG