<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{includes/partials :: head}"></div>
  <body>
    <div th:replace="~{includes/navbar :: nav}"></div>
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="d-flex justify-content-between">
                    <h3 class="mt-5 mb-2 mx-2">Add New Todo</h3>
                    <span class="mt-5 mb-2">
                        <a th:href="@{/todos}" class="btn btn-primary">
                            <i class="fa-solid fa-arrow-left"></i>Back
                        </a>
                    </span>
                </div>
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/todos/add}" 
                        	  th:object="${todo}"
                        	   method="post">
                        	<div class="mb-3">
                        		<input type="date"
                        				th:field="*{date}"
                        				class="form-control">
                        	</div>
                            <div class="mb-3">
                                <input type="text" 
                                		class="form-control"
                                		th:field="*{title}" 
                                		placeholder=" Title">
                            </div>
                            <div class="mb-3">
                                <textarea rows="4" 
                                			cols="52"
                                			th:field="*{comment}"
                                			class="form-control" 
                                			placeholder=" Comment"></textarea>
                            </div>
                            <div class="d-flex justify-content-end me-3">
                                <button type="submit" class="btn btn-primary">Add</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    <div th:replace="~{includes/partials :: footer}"></div>
  </body>
</html>
